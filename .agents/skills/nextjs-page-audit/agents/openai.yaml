interface:
  display_name: "Next.js 页面巡检"
  short_description: "巡检 Next.js 页面、交互、控制台、水合和运行时错误"
  default_prompt: "Use $nextjs-page-audit to audit the running Next.js app for page, hydration, console, and deprecation errors."

dependencies:
  tools:
    - type: "mcp"
      value: "next-devtools"
      description: "Next.js DevTools MCP for routes, runtime errors, logs, and page metadata."
      transport: "stdio"

policy:
  allow_implicit_invocation: false
